<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WLAN Stack — Ring Story</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e0d;--ink:#f2f0e8;--muted:#9aa396;--line:rgba(255,255,255,.10);
  --host:#6db3f2;--fw:#f0c05a;--nss:#6ecf9a;--nssfw:#e8896a;--apps:#c4b5fd;
  --ctrl:#7dd3fc;--data:#fbbf24;--panel:rgba(255,255,255,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap;z-index:2}
header .brand{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-.02em}
header .sub{color:var(--muted);font-size:13px;max-width:42ch}
.modes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.modes button,.scens button{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font:500 12px/1 "DM Sans",sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer;
}
.modes button.on{background:var(--ink);color:#0c0e0d;border-color:transparent}
.scens button.on{border-color:var(--data);color:var(--ink);background:rgba(251,191,36,.12)}
.wrap{display:grid;grid-template-columns:1.15fr .85fr;min-height:0}
@media(max-width:980px){.wrap{grid-template-columns:1fr;overflow:auto}body{overflow:auto}}
.stage{position:relative;display:grid;place-items:center;min-height:0;padding:12px}
svg.ring{width:min(92vw,620px);height:min(92vw,620px);overflow:visible}
.caption{position:absolute;left:20px;bottom:16px;font-size:12px;color:var(--muted);max-width:34ch;line-height:1.4}
.side{border-left:1px solid var(--line);padding:20px 22px;overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.side h2{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px}
.side .lede{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:18px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--panel);margin-bottom:12px}
.card h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.card p,.card li{font-size:13.5px;line-height:1.45}
.card ul{padding-left:16px}
.card li{margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.chip{font:500 11px/1 "DM Mono",monospace;padding:6px 9px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.chip.hot{color:var(--ink)}
.chip.host{border-color:color-mix(in srgb,var(--host) 55%,transparent);color:var(--host)}
.chip.fw{border-color:color-mix(in srgb,var(--fw) 55%,transparent);color:var(--fw)}
.chip.nss{border-color:color-mix(in srgb,var(--nss) 55%,transparent);color:var(--nss)}
.chip.nssfw{border-color:color-mix(in srgb,var(--nssfw) 55%,transparent);color:var(--nssfw)}
.chip.apps{border-color:color-mix(in srgb,var(--apps) 55%,transparent);color:var(--apps)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bigidea{border-left:3px solid var(--data);padding:4px 0 4px 12px;margin:14px 0;font-size:14px;line-height:1.45}
.scens{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.simple{font-size:15px;line-height:1.5;margin-bottom:12px}
.tech{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.pkt{filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">The Wi‑Fi onion</div>
    <div class="sub">One picture for someone new — still the real Host / FW / NSS stack</div>
  </div>
  <div class="modes" id="modes">
    <button data-m="story" class="on">Tell me a story</button>
    <button data-m="control">Control path</button>
    <button data-m="data">Data path</button>
    <button data-m="scenario">Run a scenario</button>
  </div>
</header>
<div class="wrap">
  <section class="stage">
    <svg class="ring" id="svg" viewBox="0 0 640 640" aria-label="Concentric rings of the WLAN stack"></svg>
    <div class="caption" id="caption">Each ring is a real software layer. Packets and commands travel between rings.</div>
  </section>
  <aside class="side" id="side"></aside>
</div>
<script>
/* ---- geometry helpers ---- */
const CX=320, CY=320;
const RINGS = [
  {id:'apps',  name:'Apps / mac80211',  r:292, color:'var(--apps)',  plain:'Your laptop brain: hostapd, apps, Linux Wi‑Fi stack', tech:'nl80211 · cfg80211 · mac80211'},
  {id:'host',  name:'WLAN Host',        r:236, color:'var(--host)',  plain:'The Linux driver that talks to the chip (ath10k / ath11k / ath12k)', tech:'ath1x driver · builds WMI · owns peer/vdev · hands SKBs to NSS'},
  {id:'fw',    name:'WLAN Firmware',    r:178, color:'var(--fw)',    plain:'Software living on the Wi‑Fi radio chip', tech:'WMI handlers · peer AST · air scheduling · HTT'},
  {id:'nss',   name:'NSS Host',         r:118, color:'var(--nss)',   plain:'Fast‑path helper in the kernel (moves packets quickly)', tech:'SKB ownership · recycle pool · NSS msgs to NSS FW'},
  {id:'nssfw', name:'NSS Firmware',     r:58,  color:'var(--nssfw)', plain:'Tiny engine that blasts packets at wire speed', tech:'DMA · link queues · crypto offload · MLO sched'},
];

const SCENARIOS = {
  mlo:{
    title:'MLO — add & remove a link',
    plain:'Wi‑Fi 7 can use two radios at once (two “links”). This story adds a second link, sends traffic, then removes it — while everything is still running.',
    why:'Most 12.5 bugs hide here: control deletes a link while data still sends on it.',
    layers:['apps','host','fw','nss','nssfw'],
    control:['Ask Host to add MLO link','Host → WLAN FW via WMI_MLO_LINK_SET','FW updates peer‑link map','Host tells NSS about the new link','NSS FW opens a queue for that link'],
    data:['Packets leave the app','Host gives SKB to NSS','NSS FW picks link A or B','Radio sends it','Completion comes back; SKB recycled'],
    collide:'Remove the link before the queue is empty → stuck packets, recycle underflow, sometimes a crash.',
  },
  peer:{
    title:'PEER — many phones join & leave',
    plain:'Lots of devices connect and disconnect quickly. Three notebooks must stay in sync: Host, WLAN FW, and NSS each keep a peer list.',
    why:'If one list deletes a peer and another still uses the ID, the AP can panic (APSS).',
    layers:['apps','host','fw','nss'],
    control:['Create peer (WMI)','FW allocates peer','Host mirrors to NSS','Delete peer in careful order'],
    data:['Optional light traffic per peer','TX complete must not arrive after delete'],
    collide:'Delete peer while TX complete still in flight → use‑after‑free.',
  },
  skb:{
    title:'SKB — flood of packets',
    plain:'Blast traffic. This is mostly the data highway: who owns each packet buffer (SKB), and does the recycle pool stay healthy?',
    why:'Memory bugs show up under pressure, not in quiet labs.',
    layers:['apps','host','fw','nss','nssfw'],
    control:['Bring‑up only (AP already on)'],
    data:['iperf flood','Host → NSS SKB handoff','NSS FW DMA + TX','Completions recycle buffers'],
    collide:'Link remove / recovery that frees pools mid‑flight couples SKB bugs to MLO and RECOVERY.',
  },
  apss:{
    title:'APSS — delete while busy',
    plain:'Purposely delete a peer/AP interface while traffic is still flying. We want the crash now, in the lab — not in the field.',
    why:'Forces the control/data race that causes host panics.',
    layers:['apps','host','fw','nss'],
    control:['Delete peer / vdev via WMI','NSS peer_delete'],
    data:['Heavy TX during delete','Late TX‑complete callback'],
    collide:'NSS callback after the peer is gone = classic APSS crash.',
  },
  slo:{
    title:'SLO — connect / disconnect loop',
    plain:'One radio, one link. Connect and disconnect many times. Boring — and that is the point. If this leaks, everything harder will leak too.',
    why:'Baseline leak detector before you trust MLO.',
    layers:['apps','host','fw','nss'],
    control:['VDEV start + peer create','Then reverse delete'],
    data:['Short traffic between loops'],
    collide:'Leaked peer IDs get reused later under PEER storm.',
  },
  recovery:{
    title:'RECOVERY — chip reboots',
    plain:'WLAN FW asserts (crashes). Host must reset everything, wipe peers, and come back clean. Data in the air must be aborted once — not freed twice.',
    why:'Double‑free and ghost peers after reset.',
    layers:['apps','host','fw','nss'],
    control:['Detect assert','Host reset + NSS reset','FW boots, WMI ready','Rebuild vdev/peer'],
    data:['Drain or free in‑flight SKBs once','No TX to dead rings'],
    collide:'Host and NSS both free the same SKB during flush.',
  },
};

let mode='story', scen='mlo';

function polar(a,r){return [CX+Math.cos(a)*r, CY+Math.sin(a)*r]}
function arcPath(r,a0,a1){
  const [x0,y0]=polar(a0,r),[x1,y1]=polar(a1,r);
  const large = (a1-a0)%(Math.PI*2) > Math.PI ? 1 : 0;
  return `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1}`;
}

function draw(){
  const svg=document.getElementById('svg');
  const active = mode==='scenario' ? SCENARIOS[scen].layers : RINGS.map(r=>r.id);
  let html='';
  // soft center
  html+=`<circle cx="${CX}" cy="${CY}" r="34" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>`;
  html+=`<text x="${CX}" y="${CY+4}" text-anchor="middle" fill="#f2f0e8" font-size="11" font-family="DM Sans">Wi‑Fi</text>`;

  // rings back to front
  [...RINGS].reverse().forEach((ring,i)=>{
    const on = active.includes(ring.id);
    const dim = mode==='scenario' && !on;
    html+=`<circle class="orb" data-id="${ring.id}" cx="${CX}" cy="${CY}" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="${on?3.2:1.4}" opacity="${dim?.35: on?0.95:0.55}" stroke-dasharray="${dim?'4 6':'none'}"/>`;
    // label on ring
    const [lx,ly]=polar(-Math.PI/2 - 0.15, ring.r);
    html+=`<text x="${lx}" y="${ly-8}" text-anchor="middle" fill="${ring.color}" font-size="12" font-family="DM Sans" font-weight="600" opacity="${dim?0.35:1}">${ring.name}</text>`;
  });

  // path arcs
  if(mode==='control' || mode==='story'){
    // control: outer arcs Host↔FW and Host↔NSS
    html+=`<path d="${arcPath(207,-2.4,-0.6)}" stroke="var(--ctrl)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/>`;
    html+=`<path d="${arcPath(148,0.4,2.0)}" stroke="var(--ctrl)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/>`;
    html+=`<text x="${CX+150}" y="${CY-160}" fill="var(--ctrl)" font-size="11" font-family="DM Mono">CONTROL · WMI</text>`;
    html+=`<text x="${CX-210}" y="${CY+20}" fill="var(--ctrl)" font-size="11" font-family="DM Mono">CONTROL · NSS msg</text>`;
  }
  if(mode==='data' || mode==='story'){
    html+=`<path d="${arcPath(177,2.3,3.9)}" stroke="var(--data)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/>`;
    html+=`<path d="${arcPath(88,-0.8,0.9)}" stroke="var(--data)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/>`;
    html+=`<text x="${CX-40}" y="${CY+210}" fill="var(--data)" font-size="11" font-family="DM Mono">DATA · SKB / HTT</text>`;
  }
  if(mode==='scenario'){
    // emphasize active rings with a spoke legend
    const layers=SCENARIOS[scen].layers;
    layers.forEach((id,i)=>{
      const ring=RINGS.find(r=>r.id===id);
      const a=-Math.PI/2 + i*(Math.PI*2/Math.max(layers.length,1));
      const [x,y]=polar(a, ring.r);
      html+=`<circle cx="${x}" cy="${y}" r="7" fill="${ring.color}" class="pkt"/>`;
    });
  }

  // animated packets
  html+=`<g id="packets"></g>`;
  svg.innerHTML=html;
  spawnPackets();
  renderSide();
}

function spawnPackets(){
  const g=document.getElementById('packets');
  g.innerHTML='';
  const items=[];
  if(mode==='control'||mode==='story'){
    items.push({r:207,a:-2.4,spd:0.012,color:'#7dd3fc',label:'WMI'});
    items.push({r:148,a:0.5,spd:0.014,color:'#7dd3fc',label:'NSS'});
  }
  if(mode==='data'||mode==='story'){
    items.push({r:177,a:2.4,spd:0.02,color:'#fbbf24',label:'SKB'});
    items.push({r:88,a:-0.5,spd:0.025,color:'#fbbf24',label:'DMA'});
  }
  if(mode==='scenario'){
    const cols={apps:'#c4b5fd',host:'#6db3f2',fw:'#f0c05a',nss:'#6ecf9a',nssfw:'#e8896a'};
    SCENARIOS[scen].layers.forEach((id,i)=>{
      const ring=RINGS.find(r=>r.id===id);
      items.push({r:ring.r,a:-Math.PI/2+i*0.9,spd:0.01+i*0.003,color:cols[id],label:id});
    });
  }
  items.forEach((it,i)=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r','5'); c.setAttribute('fill',it.color); c.setAttribute('class','pkt');
    g.appendChild(c); it.el=c;
  });
  function tick(){
    items.forEach(it=>{
      it.a+=it.spd;
      const [x,y]=polar(it.a,it.r);
      it.el.setAttribute('cx',x); it.el.setAttribute('cy',y);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function renderSide(){
  const side=document.getElementById('side');
  const cap=document.getElementById('caption');
  if(mode==='story'){
    cap.textContent='Start here. Outer ring = apps. Center = NSS FW. Commands hug the outer arcs; packets hug the inner arcs.';
    side.innerHTML=`
      <h2>Imagine an onion</h2>
      <p class="lede">Wi‑Fi isn’t one program. It’s five layers wrapped around each other — like rings. A command walks inward. A packet races along the rings and back out.</p>
      <div class="bigidea"><b>Control path</b> = “change the setup” (connect, keys, add a link).<br><b>Data path</b> = “send the movie / file / iperf blast”.</div>
      <div class="card"><h3>Plain English</h3>
        <p>Your phone joins an AP. That is <b>control</b>. Then Netflix starts. That is <b>data</b>. Bugs love the moment you change the setup while Netflix is still flowing.</p>
      </div>
      <div class="card"><h3>Ring cheat sheet</h3>
        <div class="row">
          ${RINGS.map(r=>`<span class="chip ${r.id==='nssfw'?'nssfw':r.id} hot">${r.name}</span>`).join('')}
        </div>
        <ul style="margin-top:10px">${RINGS.map(r=>`<li><b>${r.name}:</b> ${r.plain}</li>`).join('')}</ul>
      </div>
      <div class="card"><h3>Technical (same picture)</h3>
        <p class="tech">${RINGS.map(r=>r.name+': '+r.tech).join('\\n')}</p>
      </div>
      <p class="legend"><i style="background:var(--ctrl)"></i>Control (WMI / NSS msg) &nbsp; <i style="background:var(--data)"></i>Data (SKB / HTT / DMA)</p>
    `;
  } else if(mode==='control'){
    cap.textContent='Blue dots ride the control arcs — nl80211 → Host → WMI → FW, and Host → NSS → NSS FW.';
    side.innerHTML=`
      <h2>Control path</h2>
      <p class="simple">Think of this as <b>filing paperwork</b> for the radio. Slow, careful, must finish before traffic uses the new object.</p>
      <div class="card"><h3>Walk inward</h3>
        <ol style="padding-left:18px">
          <li>App / hostapd asks Linux</li>
          <li><b>WLAN Host</b> builds a WMI command</li>
          <li><b>WLAN FW</b> creates peer / link / key</li>
          <li>Host mirrors that into <b>NSS</b></li>
          <li><b>NSS FW</b> updates fast‑path tables</li>
        </ol>
      </div>
      <div class="card"><h3>Contracts (the wires)</h3>
        <p><span class="chip host hot">nl80211</span> → <span class="chip fw hot">WMI</span> → <span class="chip nss hot">NSS msg</span> → <span class="chip nssfw hot">NSS FW ctrl</span></p>
      </div>
      <p class="tech">Example: ath12k_wmi_peer_create → FW peer_ast_alloc → HTT peer_map → nss_wifi_peer_create</p>
    `;
  } else if(mode==='data'){
    cap.textContent='Gold dots ride the data arcs — SKBs move Host → NSS → NSS FW → radio, then completions return.';
    side.innerHTML=`
      <h2>Data path</h2>
      <p class="simple">Think of this as a <b>conveyor belt of envelopes</b> (SKBs). Each envelope has one owner at a time. Lose track of the owner → memory crash.</p>
      <div class="card"><h3>Walk the belt</h3>
        <ol style="padding-left:18px">
          <li>App writes bytes</li>
          <li><b>WLAN Host</b> prepares the frame</li>
          <li>Hands the SKB to <b>NSS Host</b> (ownership moves)</li>
          <li><b>NSS FW</b> DMA‑maps and queues it</li>
          <li><b>WLAN FW</b> / radio puts it on air</li>
          <li>Completion returns → recycle the envelope</li>
        </ol>
      </div>
      <div class="card"><h3>Contracts</h3>
        <p><span class="chip host hot">netdev / SKB</span> → <span class="chip nss hot">NSS TX</span> → <span class="chip nssfw hot">DMA</span> → <span class="chip fw hot">HTT / radio</span></p>
      </div>
      <p class="tech">ath12k_nss_tx → nss_wifi_tx_buf → nss_dma_map_skb → TX complete → nss_skb_recycle_free</p>
    `;
  } else {
    const s=SCENARIOS[scen];
    cap.textContent=s.title+' — glowing rings are on the path; dots orbit those rings.';
    side.innerHTML=`
      <div class="scens" id="scens">${Object.keys(SCENARIOS).map(k=>`<button data-s="${k}" class="${k===scen?'on':''}">${SCENARIOS[k].title.split('—')[0].trim()}</button>`).join('')}</div>
      <h2>${s.title}</h2>
      <p class="simple">${s.plain}</p>
      <div class="bigidea">${s.why}</div>
      <div class="card"><h3>Control steps</h3><ul>${s.control.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="card"><h3>Data steps</h3><ul>${s.data.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="card"><h3>Where they collide</h3><p>${s.collide}</p></div>
      <div class="row">${s.layers.map(id=>{const r=RINGS.find(x=>x.id===id);return `<span class="chip ${id==='nssfw'?'nssfw':id} hot">${r.name}</span>`}).join('')}</div>
      <p class="tech">Board 1 = AP (DUT). Board 2 = STA / peer generator. Run baseline, then patched, compare gates.</p>
    `;
    side.querySelectorAll('#scens button').forEach(b=>b.onclick=()=>{scen=b.dataset.s;draw()});
  }
}

document.getElementById('modes').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  mode=b.dataset.m;
  [...document.getElementById('modes').children].forEach(x=>x.classList.toggle('on',x===b));
  draw();
};
draw();
</script>
</body>
</html>
