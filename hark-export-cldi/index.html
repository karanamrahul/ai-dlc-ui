<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLDI Time Machine — Hark screenshot gallery</title>
    <style>
      :root {
        --bg: #0b0d12;
        --pan: #12151c;
        --ink: #e9ecf2;
        --mu: #8b93a5;
        --accent: #7dd3fc;
        --ln: #252a36;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #1a2740, var(--bg));
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        padding: 2rem 1.5rem 1rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.75rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: var(--accent);
      }
      p { margin: 0.35rem 0; color: var(--mu); max-width: 62ch; }
      a { color: var(--accent); }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      .links a {
        display: inline-block;
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--ln);
        border-radius: 8px;
        background: var(--pan);
        text-decoration: none;
      }
      .links a.primary {
        background: #e9ecf2;
        color: #0b0d12;
        border-color: transparent;
        font-weight: 600;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 1.5rem 3rem;
        display: grid;
        gap: 1.25rem;
      }
      figure {
        margin: 0;
        background: var(--pan);
        border: 1px solid var(--ln);
        border-radius: 12px;
        overflow: hidden;
      }
      figcaption {
        padding: 0.65rem 0.9rem;
        font-size: 0.85rem;
        color: var(--mu);
        border-bottom: 1px solid var(--ln);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CLDI Time Machine</h1>
      <p>
        Screenshots from
        <a href="https://hark.com/site/f43d67fc-3b43-4c40-879d-3e76a87f6031?hark_region=us"
          >hark.com/site/f43d67fc…</a
        >
        (captured live). For the full interactive offline board, open the HTML app.
      </p>
      <div class="links">
        <a class="primary" href="../CLDI-time-machine.html">Open interactive HTML</a>
        <a href="CONTENT.md">Content notes</a>
        <a href="README.md">Export README</a>
      </div>
    </header>
    <main>
      <figure>
        <figcaption>Hero — Feature 0 (MLO · ath12k)</figcaption>
        <img src="screenshots/00_hero.png" alt="CLDI Time Machine hero view" />
      </figure>
      <figure>
        <figcaption>Scroll — component swimlanes + chapters</figcaption>
        <img src="screenshots/scroll_00.png" alt="Swimlane timeline and chapters" />
      </figure>
      <figure>
        <figcaption>Scroll — rhythm heatmap, hot functions, every commit</figcaption>
        <img src="screenshots/scroll_01.png" alt="Rhythm, functions, commit list" />
      </figure>
      <figure>
        <figcaption>Further scroll</figcaption>
        <img src="screenshots/scroll_02.png" alt="Further scroll capture" />
      </figure>
    </main>
  </body>
</html>
